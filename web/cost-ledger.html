<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cost ledger — giggitai.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;600&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 80px;
    font-family: 'Lexend', sans-serif; font-weight: 300; font-size: 16px;
    color: #111111; background: #ffffff;
  }
  h1, h2 { font-weight: 600; color: #111111; }
  h1 { font-size: 28px; margin: 0 0 4px 0; }
  .subtitle { margin: 0 0 24px 0; }
  .key-term { color: #1a56db; font-weight: 600; }
  .card {
    border: 1px solid #111111; border-radius: 10px; padding: 20px 24px;
    max-width: 720px; margin: 0 auto 32px;
  }
  .card h2 { margin-top: 0; }
  .card ul { margin: 0; padding-left: 20px; }
  .card li { margin-bottom: 8px; }
  #explainer { max-width: 720px; margin: 0 auto 32px; }
  .charts {
    display: grid; grid-template-columns: 1fr; gap: 24px;
    max-width: 720px; margin: 0 auto 32px;
  }
  @media (min-width: 760px) {
    .charts { grid-template-columns: 1fr 1fr; max-width: 1400px; }
  }
  .charts svg { width: 100%; height: auto; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; margin: 0 auto; }
  th, td { text-align: left; padding: 8px 10px; }
  th { font-weight: 600; border-bottom: 2px solid #111111; }
  td { border-bottom: 1px solid #111111; }
  tbody tr:nth-child(even) { background: #f5f5f5; }
  .loading, .error { max-width: 720px; margin: 0 auto 24px; }
  .error { color: #c81e1e; }
</style>
</head>
<body>
  <h1>Cost ledger</h1>
  <p class="subtitle">The true cost of every <span class="key-term">model call</span> on giggitai.com — by day, use case, model, and step.</p>

  <div class="card">
    <h2>Overall insights</h2>
    <ul id="insights-list">
      <li>Loading…</li>
    </ul>
  </div>

  <p id="explainer" class="loading"></p>
  <p id="load-error" class="error" hidden></p>

  <div class="charts">
    <div id="chart-by-day"></div>
    <div id="chart-by-use-case"></div>
    <div id="chart-by-model"></div>
    <div id="chart-cost-per-answer"></div>
  </div>

  <h2 style="max-width:720px;margin:0 auto 12px;">Cost by day</h2>
  <table>
    <thead><tr><th>Day</th><th>Calls</th><th>Cost</th><th>p50 latency</th></tr></thead>
    <tbody id="ledger-table-body">
      <tr><td colspan="4">Loading…</td></tr>
    </tbody>
  </table>

  <script type="module">
    import { render } from './cost-ledger.js';
    render().catch((err) => {
      document.getElementById('load-error').hidden = false;
      document.getElementById('load-error').textContent =
        `Could not load the ledger: ${err.message}. The API may be rate-limited or briefly unavailable — try reloading in a minute.`;
      document.getElementById('insights-list').innerHTML = '<li>Unable to load right now.</li>';
    });
  </script>
</body>
</html>
